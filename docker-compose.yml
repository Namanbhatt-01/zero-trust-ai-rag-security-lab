version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: lab5_qdrant_db
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS=2
    networks:
      rag_security_net:
        ipv4_address: 172.40.0.10

  rag_service:
    build:
      context: ./rag_service
      dockerfile: Dockerfile
    container_name: lab5_rag_gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - RAG_URL=http://localhost:8000
    depends_on:
      - qdrant
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 5s
    networks:
      rag_security_net:
        ipv4_address: 172.40.0.20

networks:
  rag_security_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.40.0.0/24
